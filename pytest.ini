[pytest]
minversion = 8.0
testpaths = tests
addopts =
    -ra
    --strict-markers
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --html=outputs/report.html
    --self-contained-html
    --output=outputs/artifacts
timeout = 60
markers =
    smoke: testes rápidos de sanidade
    regression: suíte de regressão completa
    hybrid: testes híbridos (setup via API, validação na UI)
    api: testes somente de API
